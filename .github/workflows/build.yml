name: Build installers
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wdi:
    # USB driver installer: wdi-simple from libwdi (the library behind Zadig), built like libwdi's own CI.
    # windows-2022: libwdi's projects need the VS 2022 (v143) toolsets incl. ARM64.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { repository: pbatard/libwdi, ref: v1.5.1, path: libwdi }
      - name: libwdi support files (WDK 8.0 redistributables with WinUSB); WinUSB only
        shell: pwsh
        working-directory: libwdi
        run: |
          curl.exe -sSL "https://go.microsoft.com/fwlink/p/?LinkID=253170" -o wdk-redist.msi
          Start-Process msiexec -ArgumentList "/a wdk-redist.msi /qn TARGETDIR=$PWD\wdk" -Wait
          # Only WinUSB is needed: drop the libusb0/libusbK defaults from the MSVC config (embedder_files.h
          # and libwdi.c only embed those drivers when LIBUSB0_DIR/LIBUSBK_DIR are defined).
          $c = Get-Content -Raw msvc\config.h
          $c = $c -replace '(?s)#ifndef LIBUSB0_DIR.*?#endif', '' -replace '(?s)#ifndef LIBUSBK_DIR.*?#endif', ''
          Set-Content msvc\config.h $c
          Select-String -Path msvc\config.h -Pattern 'LIBUSB' | ForEach-Object { $_.Line }
      - uses: microsoft/setup-msbuild@v2
      - name: Build wdi-simple (Win32 first, as libwdi's CI does, then x64)
        shell: cmd
        working-directory: libwdi
        run: |
          for %%P in (Win32 x64) do (
            msbuild libwdi.sln /m /p:Configuration=Release,Platform=%%P,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          )
      - run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item libwdi\x64\Release\examples\wdi-simple.exe, libwdi\COPYING, libwdi\COPYING-LGPL out\
      - uses: actions/upload-artifact@v4
        with: { name: wdi-simple, path: out }

  windows:
    needs: wdi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pillow PySide6 pyqtgraph numpy scipy pyserial pyusb libusb-package
      - run: >
          pyinstaller --noconfirm --windowed --name LibreRamen --icon libreramen/data/icon.png
          --add-data libreramen/data:libreramen/data --collect-all libusb_package --collect-submodules serial
          --hidden-import usb.backend.libusb1 libreramen_app.py
      - run: dist\LibreRamen\LibreRamen.exe standards
      - name: Self-test of the packaged app (GUI + simulator)
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          $p = Start-Process -FilePath dist\LibreRamen\LibreRamen.exe -ArgumentList selftest -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - run: Compress-Archive -Path dist\LibreRamen -DestinationPath dist\LibreRamen-Windows.zip
      - name: Console build (command line and remote diagnostics)
        run: >
          pyinstaller --noconfirm --console --name LibreRamenCLI --icon libreramen/data/icon.png
          --add-data libreramen/data:libreramen/data --collect-all libusb_package --collect-submodules serial
          --hidden-import usb.backend.libusb1 --exclude-module PySide6 --exclude-module pyqtgraph libreramen_app.py
      - run: dist\LibreRamenCLI\LibreRamenCLI.exe standards
      - run: Compress-Archive -Path dist\LibreRamenCLI -DestinationPath dist\LibreRamenCLI-Windows.zip
      - uses: actions/download-artifact@v4
        with: { name: wdi-simple, path: wdi }
      - name: Collect driver files, licence and icon
        run: |
          New-Item -ItemType Directory -Force dist\drivers | Out-Null
          Copy-Item wdi\wdi-simple.exe dist\drivers\
          $notice = "wdi-simple.exe is built from libwdi v1.5.1 (https://github.com/pbatard/libwdi, " +
                    "source: https://github.com/pbatard/libwdi/tree/v1.5.1), (c) Pete Batard and contributors, " +
                    "licensed under the GNU LGPL v3 or later (text below, followed by the GPL v3 it refers to).`r`n`r`n"
          $notice + (Get-Content -Raw wdi\COPYING-LGPL) + "`r`n`r`n" + (Get-Content -Raw wdi\COPYING) |
            Set-Content -Encoding utf8 dist\drivers\LIBWDI-LICENSE.txt
          python -c "from PIL import Image; Image.open('libreramen/data/icon.png').save('dist/libreramen.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build the installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $ver = python -c "import libreramen; print(libreramen.__version__)"
          iscc /Qp "/DAppVersion=$ver" installer\windows\libreramen.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\LibreRamen-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: dist/LibreRamen-Setup-*.exe }
      - uses: actions/upload-artifact@v4
        with: { name: windows-cli-zip, path: dist/LibreRamenCLI-Windows.zip }
      - uses: actions/upload-artifact@v4
        with: { name: windows-zip, path: dist/LibreRamen-Windows.zip }

  macos-intel:
    # Intel build with macOS 12 (Monterey) as minimum; Qt 6.9 is the last Qt supporting macOS 12.
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pillow "PySide6==6.9.*" pyqtgraph pyserial pyusb libusb-package
      # numpy/scipy: the runner (macOS 15) would pick wheels linked against the new Accelerate (macOS 13.3+),
      # which crash at start-up on macOS 12. Install the wheels tagged for macOS 12 (OpenBLAS) explicitly.
      - run: |
          pip uninstall -y numpy scipy || true
          SP=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          pip install --only-binary=:all: --platform macosx_12_0_x86_64 --python-version 3.12 \
            --implementation cp --target "$SP" --upgrade --no-deps numpy scipy
      - run: |
          python - <<'PY'
          import glob, numpy, scipy, subprocess
          print("numpy", numpy.__version__, "scipy", scipy.__version__)
          for so in glob.glob(numpy.__path__[0] + "/_core/_multiarray_umath*.so"):
              out = subprocess.run(["otool", "-L", so], capture_output=True, text=True).stdout
              assert "Accelerate" not in out, "numpy is linked against Accelerate (won't run on macOS 12)"
              print(out)
          PY
      - run: |
          pyinstaller --noconfirm --windowed --name LibreRamen \
            --osx-bundle-identifier io.github.ohlincha.libreramen --icon libreramen/data/icon.png \
            --add-data libreramen/data:libreramen/data --collect-all libusb_package --collect-submodules serial \
            --hidden-import usb.backend.libusb1 libreramen_app.py
          mkdir -p dmg && cp -R dist/LibreRamen.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname LibreRamen -srcfolder dmg -ov -format UDZO dist/LibreRamen-macOS-Intel.dmg
      - run: dist/LibreRamen.app/Contents/MacOS/LibreRamen standards | head -3
      - name: Self-test of the packaged app (GUI + simulator)
        run: QT_QPA_PLATFORM=offscreen dist/LibreRamen.app/Contents/MacOS/LibreRamen selftest
      - uses: actions/upload-artifact@v4
        with: { name: macos-intel-dmg, path: dist/LibreRamen-macOS-Intel.dmg }
